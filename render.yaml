# Render Blueprint for SevaSetu (hyperlocal services marketplace).
#
# Render dashboard → New + → Blueprint → pick this repository. The
# default Blueprint Path (render.yaml at the root) is correct.
#
# Creates: a PostgreSQL database, the customer/worker app (+ API) and the
# admin panel (+ API) as two services on separate subdomains (plan §10).
# Encryption keys are generated once and shared by both services. Values
# marked `sync: false` are prompted for during setup; they're never read
# from this file.
databases:
  - name: sevasetu-db
    databaseName: sevasetu
    user: sevasetu
    plan: basic-256mb

envVarGroups:
  - name: sevasetu-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Secrets: generated by Render once, shared by both services.
      # Back up PII_ENCRYPTION_KEY separately: losing it makes stored PII unreadable.
      - key: JWT_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: LOOKUP_HMAC_KEY
        generateValue: true
      # Payments — Razorpay (live keys) + RazorpayX for payouts.
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      # SMS OTP — MSG91 (DLT-approved template with an `otp` variable).
      - key: SMS_PROVIDER
        value: msg91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      # Masked calling — Exotel.
      - key: CALL_PROVIDER
        value: exotel
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false

services:
  # Customer & worker app + API: https://sevasetu-app.onrender.com
  # Razorpay webhook URL: https://<this service>/api/webhooks/razorpay
  - type: web
    name: sevasetu-app
    runtime: node
    plan: starter
    buildCommand: cd web && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - fromGroup: sevasetu-shared
      - key: DATABASE_URL
        fromDatabase:
          name: sevasetu-db
          property: connectionString
      - key: SERVE_FRONTEND
        value: web
      # Background jobs (reconciliation, auto-confirm, …) run here only.
      - key: RUN_SCHEDULER
        value: "true"
      # First-run admins (created only while no admin exists). Two people,
      # so maker-checker works from day one. Passwords: 12+ chars, mixed.
      - key: BOOTSTRAP_OPS_EMAIL
        sync: false
      - key: BOOTSTRAP_OPS_PASSWORD
        sync: false
      - key: BOOTSTRAP_FINANCE_EMAIL
        sync: false
      - key: BOOTSTRAP_FINANCE_PASSWORD
        sync: false

  # Admin panel + API on its own subdomain: https://sevasetu-admin.onrender.com
  - type: web
    name: sevasetu-admin
    runtime: node
    plan: starter
    buildCommand: cd admin && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - fromGroup: sevasetu-shared
      - key: DATABASE_URL
        fromDatabase:
          name: sevasetu-db
          property: connectionString
      - key: SERVE_FRONTEND
        value: admin
      - key: RUN_SCHEDULER
        value: "false"
