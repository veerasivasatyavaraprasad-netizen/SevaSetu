# SevaSetu on a single server (Oracle Cloud Always Free, or any Ubuntu VM).
# Managed by setup.sh — see deploy/oracle/README.md.
name: sevasetu

x-app: &app
  image: sevasetu:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgres://sevasetu:${POSTGRES_PASSWORD}@db:5432/sevasetu
    CORS_ORIGINS: https://${APP_DOMAIN},https://${ADMIN_DOMAIN}
    TRUST_PROXY_HOPS: "1"
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sevasetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sevasetu
    volumes: [pgdata:/var/lib/postgresql/data]
    # No published port: only the app containers can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevasetu"]
      interval: 5s
      retries: 20

  app:
    <<: *app
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      <<: *app-env
      SERVE_FRONTEND: web
      RUN_SCHEDULER: "true"

  admin:
    <<: *app
    environment:
      <<: *app-env
      SERVE_FRONTEND: admin
      RUN_SCHEDULER: "false"
    # Same image the app service builds; never pulled from a registry.
    pull_policy: never
    depends_on:
      db: { condition: service_healthy }
      app: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, admin]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
